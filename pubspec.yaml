name: payment_approval
description: "Payment approval flow: review incoming payment requests and approve or reject them with device authentication."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  bloc_concurrency: ^0.3.0
  characters: ^1.4.1
  clock: ^1.1.3
  cupertino_icons: ^1.0.9
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  intl: ^0.20.3
  local_auth: ^3.0.2
  material_ui: ^1.5.0
  rxdart: ^0.28.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  lint: ^2.14.0
  mocktail: ^1.0.5

flutter:
  # Enables the web build for this project without changing global Flutter settings
  config:
    enable-web: true
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/inter/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
