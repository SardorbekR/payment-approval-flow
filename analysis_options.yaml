include: package:lint/strict.yaml

analyzer:
  exclude:
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
    - web/**

formatter:
  page_width: 100
  trailing_commas: preserve

linter:
  rules:
    # Dart 3.13 primary constructors and private named parameters are only weeks old.
    # Classic constructors stay for now so the code reads the same to every reviewer.
    use_primary_constructors: false
    unnecessary_type_name_in_constructor: false
    prefer_initializing_formals: false
